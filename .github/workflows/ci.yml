---
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Least privilege at the workflow level; jobs elevate only what they need.
permissions: {}
jobs:
  test:
    name: Build & test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          # Cache disabled on macOS: a suspected stale/corrupt build cache is
          # one candidate for the "missing LC_UUID" dyld abort seen there
          # even without -race (see README "Known CI limitations").
          cache: ${{ matrix.os != 'macos-latest' }}
      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        # -race is skipped on macOS: race-instrumented binaries trigger a
        # dyld "missing LC_UUID load command" abort on macos-latest runners
        # (https://github.com/golang/go/issues/61229). -extldflags=-ld_classic
        # was tried and did not resolve it. ubuntu and windows are unaffected.
        env:
          GO_TEST_RACE: ${{ matrix.os != 'macos-latest' && '-race' || '' }}
        run: go test $GO_TEST_RACE -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage (${{ matrix.os }})"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 14
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
